<!doctype html>
<html lang="{{ lang }}">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#1f6feb" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="สโตร์หน้างาน" />
		<title>สโตร์หน้างาน</title>
		<link rel="manifest" href="/assets/consbiz/site_store/manifest.webmanifest" />
		<link rel="icon" type="image/png" href="/assets/consbiz/site_store/icon-192.png" />
		<link rel="apple-touch-icon" href="/assets/consbiz/site_store/icon-192.png" />
		<link rel="preload" as="font" type="font/woff2" crossorigin
			href="/assets/consbiz/fonts/noto-sans-thai/NotoSansThai-Variable-thai.woff2" />
		<style>
			@font-face {
				font-family: "Noto Sans Thai";
				font-weight: 100 900;
				font-display: swap;
				src: url("/assets/consbiz/fonts/noto-sans-thai/NotoSansThai-Variable-thai.woff2") format("woff2");
				unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
			}
			@font-face {
				font-family: "Inter";
				font-weight: 400;
				font-display: swap;
				src: url("/assets/frappe/css/fonts/inter/Inter-Regular.woff2") format("woff2");
			}
			@font-face {
				font-family: "Inter";
				font-weight: 600;
				font-display: swap;
				src: url("/assets/frappe/css/fonts/inter/Inter-SemiBold.woff2") format("woff2");
			}
			@font-face {
				font-family: "Inter";
				font-weight: 700;
				font-display: swap;
				src: url("/assets/frappe/css/fonts/inter/Inter-Bold.woff2") format("woff2");
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #eef2f8;
				font-family: "Inter", "Noto Sans Thai", system-ui, -apple-system, sans-serif;
			}
			.boot-splash {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: linear-gradient(160deg, #1f6feb, #5b3df5);
				color: #fff;
				transition: opacity 0.35s ease;
			}
			.boot-splash .logo {
				width: 76px;
				height: 76px;
				border-radius: 22px;
				background: rgba(255, 255, 255, 0.16);
				display: grid;
				place-items: center;
				animation: boot-pulse 1.2s ease-in-out infinite;
			}
			@keyframes boot-pulse {
				50% {
					transform: scale(0.92);
					opacity: 0.7;
				}
			}
		</style>
	</head>
	<body>
		<div id="store-app">
			<div class="boot-splash">
				<div class="logo">
					<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round">
						<path d="M21 8 12 3 3 8v8l9 5 9-5z" />
						<path d="m3 8 9 5 9-5M12 13v8" />
					</svg>
				</div>
			</div>
		</div>
		<script>
			window.frappe = window.frappe || {};
			frappe.dom = frappe.dom || {
				set_style(css) {
					const style = document.createElement("style");
					style.textContent = css;
					document.head.appendChild(style);
				},
			};
			window.STORE_BOOT = {{ boot | safe }};
		</script>
		<!-- csrf_token -->
		{{ include_script("site_store.bundle.js") }}
	</body>
</html>
