<!doctype html>
<html lang="{{ lang }}">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="theme-color" content="#15803d" id="theme-color" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="ConsERP" />
		<title>ConsERP</title>
		<link rel="manifest" href="/assets/consbiz/site_app/manifest.webmanifest?v=5" />
		<link rel="icon" type="image/png" href="/assets/consbiz/site_app/conserp-round-192.png" />
		<link rel="apple-touch-icon" href="/assets/consbiz/site_app/conserp-round-192.png" />
		<link rel="preload" as="font" type="font/woff2" crossorigin
			href="/assets/consbiz/fonts/noto-sans-thai/NotoSansThai-Variable-thai.woff2" />
		<style>
			@font-face {
				font-family: "Noto Sans Thai";
				font-weight: 100 900;
				font-display: swap;
				src: url("/assets/consbiz/fonts/noto-sans-thai/NotoSansThai-Variable-thai.woff2") format("woff2");
				unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
			}
			@font-face {
				font-family: "Inter";
				font-weight: 400;
				font-display: swap;
				src: url("/assets/frappe/css/fonts/inter/Inter-Regular.woff2") format("woff2");
			}
			@font-face {
				font-family: "Inter";
				font-weight: 600;
				font-display: swap;
				src: url("/assets/frappe/css/fonts/inter/Inter-SemiBold.woff2") format("woff2");
			}
			@font-face {
				font-family: "Inter";
				font-weight: 700;
				font-display: swap;
				src: url("/assets/frappe/css/fonts/inter/Inter-Bold.woff2") format("woff2");
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: #eef2f8;
				font-family: "Inter", "Noto Sans Thai", system-ui, -apple-system, sans-serif;
			}
			.boot-splash {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: #2e3754;
				color: #fff;
				transition: opacity 0.35s ease;
			}
			.boot-splash .logo {
				width: 76px;
				height: 76px;
				border-radius: 22px;
				animation: boot-pulse 1.2s ease-in-out infinite;
			}
			@keyframes boot-pulse {
				50% {
					transform: scale(0.92);
					opacity: 0.7;
				}
			}
		</style>
	</head>
	<body>
		<div id="self-app">
			<div class="boot-splash">
				<img class="logo" src="/assets/consbiz/site_app/conserp-round-192.png" alt="ConsERP" />
			</div>
		</div>
		<script>
			window.frappe = window.frappe || {};
			frappe.dom = frappe.dom || {
				set_style(css) {
					const style = document.createElement("style");
					style.textContent = css;
					document.head.appendChild(style);
				},
			};
			window.APP_BOOT = {{ boot | safe }};
		</script>
		<!-- csrf_token -->
		{{ include_script("self_app.bundle.js") }}
	</body>
</html>
